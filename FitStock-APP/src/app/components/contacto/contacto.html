@if (!embed) {
  <div class="contacto-bg"></div>
}
<div class="contacto-wrapper" [class.contacto-wrapper-embed]="embed">
  <div class="contacto-card">
    <div class="contacto-header">
      <div class="contacto-logo">F</div>
      <h2>Contacto</h2>
      <p>Déjanos tu correo y cuéntanos qué necesitas</p>
    </div>
    <div class="contacto-body">
      @if (success) {
        <div class="success-msg">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          Mensaje enviado correctamente. Te contactaremos pronto.
        </div>
      }
      @if (error) {
        <div class="error-msg">{{ error }}</div>
      }
      <form (ngSubmit)="enviar()">
        <div class="field">
          <label>Tu correo electrónico</label>
          <input type="email" [(ngModel)]="email" name="email" required placeholder="tu@email.com">
        </div>
        <div class="field">
          <label>Descripción de lo que necesitas</label>
          <textarea [(ngModel)]="mensaje" name="mensaje" required placeholder="Cuéntanos qué necesitas..." rows="6"></textarea>
        </div>
        <button type="submit" class="btn-primary" [disabled]="sending">
          @if (sending) {
            Enviando...
          } @else {
            Enviar Mensaje
          }
        </button>
      </form>
      @if (!embed) {
        <div class="contacto-footer">
          <a class="back-link" (click)="irAPortal()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Volver al Portal
          </a>
        </div>
      }
    </div>
  </div>
</div>
