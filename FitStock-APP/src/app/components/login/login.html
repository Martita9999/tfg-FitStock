<!-- Contenedor principal del login -->
<div class="login-wrapper">
  <!-- Botón para alternar entre modo claro y modo oscuro -->
  <button class="theme-toggle" (click)="toggleDarkMode()">
    @if (darkMode) {
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    } @else {
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    }
  </button>
  <!-- Tarjeta de inicio de sesión -->
  <div class="login-card">
    <!-- Cabecera con logo y título -->
    <div class="login-header">
      <div class="logo-icon">F</div>
      <h2>FitStock</h2>
      <p>Inicia sesión para continuar</p>
    </div>
    <!-- Cuerpo del formulario de login -->
    <div class="login-body">
      <!-- Mensaje de error condicional -->
      @if (error) {
        <div class="error-msg">{{ error }}</div>
      }
      <!-- Formulario de inicio de sesión con email y contraseña -->
      <form (ngSubmit)="login()">
        <div class="field">
          <label>Email</label>
          <input type="email" [(ngModel)]="email" name="email" required placeholder="tu@email.com">
        </div>
        <div class="field">
          <label>Contraseña</label>
          <input type="password" [(ngModel)]="password" name="password" required placeholder="••••••">
        </div>
        <button type="submit" class="btn-primary">Iniciar Sesión</button>
      </form>
      <!-- Enlaces de navegación: registro y portal -->
      <div class="register-link">
        ¿No tienes cuenta? <a (click)="goToRegistro()">Regístrate</a>
        <span class="separator">|</span>
        <a class="portal-link" (click)="goToPortal()">Portal Web</a>
      </div>
    </div>
  </div>
</div>

<!-- Modal de cambio de contraseña obligatorio para clientes -->
@if (showPasswordModal) {
  <!-- Modal para que el cliente cambie su contraseña por solicitud del administrador -->
  <div class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Cambio de Contraseña</h3>
      </div>
      <div class="modal-body">
        <p style="font-size:14px;color:var(--text-secondary);margin-bottom:16px;">
          El administrador ha solicitado que cambies tu contraseña antes de continuar.
        </p>
        @if (passwordError) {
          <div class="error-msg">{{ passwordError }}</div>
        }
        <div class="field">
          <label>Contraseña actual</label>
          <input type="password" [(ngModel)]="currentPassword" name="currentPass" placeholder="••••••">
        </div>
        <div class="field">
          <label>Nueva contraseña</label>
          <input type="password" [(ngModel)]="newPassword" name="newPass" placeholder="••••••">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-save" (click)="cambiarPassword()">Cambiar Contraseña</button>
      </div>
    </div>
  </div>
}
