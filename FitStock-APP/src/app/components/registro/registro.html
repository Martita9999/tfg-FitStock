<!-- Página de registro de nuevo usuario -->
<!-- Contenedor principal del registro -->
<div class="registro-wrapper">
  <!-- Tarjeta de registro -->
  <div class="registro-card">
    <!-- Cabecera con logo y título -->
    <div class="registro-header">
      <div class="logo-icon">F</div>
      <h2>Crear Cuenta</h2>
      <p>Regístrate en FitStock</p>
    </div>
    <!-- Cuerpo del formulario de registro -->
    <div class="registro-body">
      <!-- Mensaje de error condicional -->
      @if (error) {
        <div class="error-msg">{{ error }}</div>
      }
      <!-- Mensaje de éxito condicional con redirección automática -->
      @if (success) {
        <div class="success-msg">Cuenta creada. Redirigiendo...</div>
      }
      <!-- Formulario de registro: nombre, email y contraseña -->
      <form (ngSubmit)="registrar()">
        <div class="field">
          <label>Nombre</label>
          <input type="text" [(ngModel)]="nombre" name="nombre" required placeholder="Tu nombre">
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" [(ngModel)]="email" name="email" required placeholder="tu@email.com">
        </div>
        <div class="field">
          <label>Contraseña</label>
          <input type="password" [(ngModel)]="password" name="password" required placeholder="••••••">
        </div>
        <button type="submit" class="btn-primary">Registrarse</button>
      </form>
      <!-- Enlace para volver al login si ya tiene cuenta -->
      <div class="login-link">
        ¿Ya tienes cuenta? <a (click)="goToLogin()">Inicia sesión</a>
      </div>
    </div>
  </div>
</div>
