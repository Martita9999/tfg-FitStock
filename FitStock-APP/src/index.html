<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FitStock</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/jpg" href="/API/icono.jpg">
  <!-- Script inline para aplicar el tema oscuro antes de que se renderice la página -->

    if (localStorage.getItem('darkMode') === 'true') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  </script>
</head>
<body>
  <!-- Componente raíz donde Angular monta la aplicación -->
  <app-root></app-root>
</body>
</html>
