<!-- Página de gestión de materiales/equipamiento deportivo -->
<div>
  <!-- Cabecera con título y botón de crear -->
  <div class="header-actions">
    <h2 class="page-title">🏋️ Máquinas</h2>
    <!-- Botón crear: oculto para clientes -->
    <button class="btn-create" (click)="abrirModal()" *ngIf="userRole !== 'cliente'">+ Crear Máquina</button>
  </div>

  <!-- Tabla de materiales (visible si hay datos) -->
  <table class="data-table" *ngIf="lista.length > 0">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Estado</th>
        <th>Código QR</th>
        <th>Última Revisión</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let m of lista">
        <td>{{ m.id }}</td>
        <td><strong>{{ m.nombre }}</strong></td>
        <td>
          <!-- Badge de estado con color según valor -->
          <span class="status-badge" [class.operativo]="m.estado === 'operativo'"
                [class.averiado]="m.estado !== 'operativo'">
            {{ m.estado === 'operativo' ? 'Operativo' : m.estado }}
          </span>
        </td>
        <td><code>{{ m.qr || '—' }}</code></td>
        <td>{{ m.ultima_rev || 'No revisado' }}</td>
        <td>
          <!-- Botón eliminar: oculto para clientes -->
          <button class="btn-delete" (click)="borrarMaterial(m.id, m.nombre)" title="Borrar material" *ngIf="userRole !== 'cliente'">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- Mensaje cuando no hay materiales -->
  <div class="empty-state" *ngIf="lista.length === 0">
    <p>No hay máquinas registradas.</p>
  </div>
</div>

<!-- Modal para crear nuevo material -->
<div class="modal-overlay" *ngIf="showModal" (click)="cerrarModal()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>Crear Máquina</h3>
      <button class="btn-close" (click)="cerrarModal()">X</button>
    </div>
    <div class="modal-body">
      @if (error) {
        <div class="error-msg">{{ error }}</div>
      }
      <div class="field">
        <label>Nombre del Equipo</label>
        <input type="text" [(ngModel)]="newMaterial.nombre" name="nombre" placeholder="Nombre de la máquina">
      </div>
      <div class="field">
        <label>Descripción</label>
        <textarea [(ngModel)]="newMaterial.descripcion" name="descripcion" rows="2" placeholder="Descripción"></textarea>
      </div>
      <div class="field">
        <label>Estado</label>
        <select [(ngModel)]="newMaterial.estado" name="estado">
          <option value="operativo">Operativo</option>
          <option value="averiado">Averiado</option>
          <option value="en_reparacion">En Reparación</option>
          <option value="baja">De Baja</option>
        </select>
      </div>
      <div class="field">
        <label>Código QR (opcional)</label>
        <input type="text" [(ngModel)]="newMaterial.qr" name="qr" placeholder="Identificador QR">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" (click)="cerrarModal()">Cancelar</button>
      <button class="btn-save" (click)="crearMaterial()">Guardar</button>
    </div>
  </div>
</div>
